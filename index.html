<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Frota Casagrande</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#141414">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#141414;--card:#1e1e1e;--field:#2a2a2a;--ink:#f5f5f5;--mut:#9a9a9a;--acc:#fcc85c;--ok:#4caf50;--bad:#e05252}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;min-height:100dvh}
#app{max-width:1100px;margin:0 auto}
.hide{display:none!important}
/* ---------- login ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#login img.logo{width:min(320px,78vw);margin-bottom:36px}
.card{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:380px}
.card h2{font-size:17px;margin-bottom:16px;color:var(--ink)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--field);border:1px solid #3a3a3a;border-radius:10px;padding:12px;font-size:15px;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;background:var(--acc);color:#141414;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;margin-top:18px}
.btn.sec{background:var(--field);color:var(--ink);font-weight:600}
.btn.mini{width:auto;padding:8px 14px;font-size:13px;margin-top:0;border-radius:9px}
.btn:disabled{opacity:.5}
.msg{font-size:13px;margin-top:10px;min-height:16px}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
/* ---------- shell ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(20,20,20,.94);backdrop-filter:blur(8px);padding:12px 16px;display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top))}
header img{height:30px}
header .tt{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{background:none;border:none;color:var(--ink);font-size:22px;line-height:1;padding:4px 8px}
.bell{position:relative;background:none;border:none;font-size:20px;color:var(--ink)}
.bell .bdg{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px}
nav{position:fixed;top:0;left:-260px;width:250px;height:100vh;height:100dvh;background:#101010;z-index:40;transition:left .25s;padding:calc(16px + env(safe-area-inset-top)) 12px 16px;overflow-y:auto}
nav.open{left:0}
nav .who{font-size:13px;color:var(--mut);padding:8px 10px 14px;border-bottom:1px solid #262626;margin-bottom:8px}
nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:11px 12px;border-radius:10px;font-size:14px}
nav button.on{background:#262626;color:var(--acc)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
main{padding:16px;padding-bottom:80px}
h1.pg{font-size:19px;margin-bottom:14px}
/* ---------- componentes ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border-radius:16px;padding:18px 14px;text-align:center;font-size:14px;font-weight:600;border:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;align-items:center}
.tile .em{font-size:28px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:14px;padding:14px}
.kpi .v{font-size:22px;font-weight:800;color:var(--acc)}
.kpi .l{font-size:11px;color:var(--mut);margin-top:3px}
.tblwrap{overflow-x:auto;background:var(--card);border-radius:14px;padding:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid #2c2c2c;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #242424;vertical-align:top}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.tag.aberta{background:#3a2f14;color:var(--acc)}
.tag.conferencia{background:#14304a;color:#7db8e8}
.tag.fechada{background:#1c3320;color:#7fd88f}
.tag.aguardando,.tag.recebida,.tag.recebido,.tag.aguardando_ciencia{background:#3a2f14;color:var(--acc)}
.tag.aprovada,.tag.fechada,.tag.resolvida,.tag.concluida{background:#1c3320;color:#7fd88f}
.tag.reprovada{background:#3a1a1a;color:#e88}
.tag.em_analise,.tag.em_execucao,.tag.encaminhado,.tag.ciente,.tag.providencia{background:#14304a;color:#7db8e8}
.tag.aguardando_peca{background:#3a2f14;color:var(--acc)}
.tag.arquivado{background:#2a2a2a;color:#888}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sec{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h3{font-size:14px;margin-bottom:10px}
.sec .hint{font-size:12px;color:var(--mut)}
.wm{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:0;opacity:.06}
.wm img{width:min(72vw,600px);filter:brightness(10)}
main>*{position:relative;z-index:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#2e2e2e;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw}
#toast.on{opacity:1}
.empty{color:var(--mut);font-size:13px;padding:18px;text-align:center}
.photo{max-width:140px;border-radius:10px;display:block;margin-top:6px}
.cfitem{border:1px solid #2c2c2c;border-radius:12px;padding:12px;margin:8px 0}
.cfitem.ok{border-color:#2e5c34;background:#1a241b}
.cfitem.no{border-color:#5c3a2e;background:#241d1a}
@media(min-width:700px){nav{position:fixed;left:0;width:230px}#scrim{display:none}main{margin-left:230px}header{margin-left:230px}}
</style>
</head>
<body>
<div class="wm"><img src="logo-branca.png" alt=""></div>
<div id="login">
  <img class="logo" src="logo-branca.png" alt="Ovos Casagrande">
  <div class="card" id="card-login">
    <h2>Gestão de Frota</h2>
    <label>Usuário</label>
    <input id="li-email" type="email" placeholder="email@casagrande" autocomplete="username">
    <label>Senha</label>
    <input id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="li-btn">Entrar</button>
    <div class="msg" id="li-msg"></div>
    <div class="hint" style="font-size:11px;color:var(--mut);margin-top:8px">Primeiro acesso vira GERÊNCIA automaticamente</div>
    <button class="btn sec" id="li-cfg" style="margin-top:10px">⚙️ Configurar conexão</button>
    <div class="msg" id="cfg-msg"></div>
    <button class="btn sec" id="li-criar" style="margin-top:10px">➕ Criar conta (equipe)</button>
  </div>
  <div class="card hide" id="card-criar">
    <h2>Criar conta</h2>
    <label>Seu nome</label><input id="cr-nome" placeholder="nome completo">
    <label>Email</label><input id="cr-email" type="email" autocomplete="username">
    <label>Senha (mín. 6)</label><input id="cr-pass" type="password" autocomplete="new-password">
    <button class="btn" id="cr-btn">Criar minha conta</button>
    <div class="msg" id="cr-msg"></div>
    <button class="btn sec" id="cr-voltar" style="margin-top:10px">← Voltar para o login</button>
  </div>
</div>
<div id="app" class="hide">
  <header>
    <button class="burger" id="burger">☰</button>
    <img src="logo-branca.png" alt="">
    <div class="tt" id="pg-title">Início</div>
    <button class="bell" id="bell">🔔<span class="bdg hide" id="bdg">0</span></button>
  </header>
  <div id="scrim" class="hide"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))}
</script>
<script>
'use strict';
/* ============ conexão ============ */
const SUPABASE_URL_KEY='fc_url', SUPABASE_ANON_KEY='fc_anon';
let sb=null;
function api(){return sb}
function loadConn(){return{url:localStorage.getItem(SUPABASE_URL_KEY)||'',anon:localStorage.getItem(SUPABASE_ANON_KEY)||''}}
function saveConn(url,anon){localStorage.setItem(SUPABASE_URL_KEY,url.trim());localStorage.setItem(SUPABASE_ANON_KEY,anon.trim());sb=window.supabase.createClient(url.trim(),anon.trim())}
function hasConn(){const c=loadConn();return !!(c.url&&c.anon)}
function readParams(){
  const p=new URLSearchParams(location.search);
  const u=p.get('url'),a=p.get('anon');
  if(u&&a){saveConn(u,a);history.replaceState(null,'',location.pathname)}
}
function ensureClient(){if(!sb&&hasConn())saveConn(loadConn().url,loadConn().anon);return sb}
/* ============ estado ============ */
let ME=null, NAV=[], PAGE='home';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function placaLimpa(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8)}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2600)}
function fmt(v){return v==null||v===''?'—':v}
function fmtD(d){if(!d)return'—';const x=new Date(d);return x.toLocaleDateString('pt-BR')}
function fmtDT(d){if(!d)return'—';const x=new Date(d);return x.toLocaleDateString('pt-BR')+' '+x.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function fmtBRL(v){return v==null?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function km(v){return v==null?'—':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0})+' km'}
function hoje(){return new Date().toISOString().slice(0,10)}
function tag(s){return s?`<span class="tag ${esc(s)}">${esc(s.replace(/_/g,' '))}</span>`:'—'}
function opt(list,sel){return list.map(o=>`<option value="${esc(o[0])}" ${o[0]==sel?'selected':''}>${esc(o[1])}</option>`).join('')}
function empty(t){return `<div class="empty">${t}</div>`}
function err(e){return (e&&e.message)?e.message:'Erro inesperado'}
/* ============ boot ============ */
window.addEventListener('load',init);
async function init(){
  readParams();
  if(!ensureClient()){showCfg();return}
  const {data} = await sb.auth.getSession();
  if(data.session){await afterLogin()}else{showLogin()}
}
async function showLogin(){
  $('app').classList.add('hide');$('login').classList.remove('hide');
  $('li-msg').textContent=hasConn()?'':'Configure a conexão para entrar';
}
function showCfg(){
  $('app').classList.add('hide');$('login').classList.remove('hide');
  $('li-msg').textContent='Configure a conexão com o banco (uma vez por aparelho)';
  $('li-cfg').textContent='⚙️ Configurar conexão';
}
$('li-cfg').onclick=async()=>{
  const url=prompt('URL do projeto Supabase (Settings → API → Project URL):');
  if(!url)return;
  const anon=prompt('Chave anon public (Settings → API → anon public):');
  if(!anon)return;
  try{saveConn(url,anon);$('cfg-msg').className='msg ok';$('cfg-msg').textContent='Conexão salva!';await init()}catch(e){$('cfg-msg').className='msg err';$('cfg-msg').textContent=err(e)}
};
$('li-btn').onclick=login;
$('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('li-criar').onclick=()=>{$('card-login').classList.add('hide');$('card-criar').classList.remove('hide');$('cr-msg').textContent=''};
$('cr-voltar').onclick=()=>{$('card-criar').classList.add('hide');$('card-login').classList.remove('hide')};
$('cr-btn').onclick=async()=>{
  const nome=$('cr-nome').value.trim(),email=$('cr-email').value.trim(),pass=$('cr-pass').value;
  if(!nome||!email||pass.length<6){$('cr-msg').className='msg err';$('cr-msg').textContent='Preencha nome, email e senha (mín. 6 caracteres)';return}
  $('cr-btn').disabled=true;
  try{
    const {error}=await sb.auth.signUp({email,password:pass});
    if(error)throw error;
    $('card-criar').classList.add('hide');$('card-login').classList.remove('hide');
    $('li-msg').className='msg ok';$('li-msg').textContent='Conta criada! A gerência vai definir seu perfil — depois feche e reabra o app.';
  }catch(e){$('cr-msg').className='msg err';$('cr-msg').textContent=err(e)}
  $('cr-btn').disabled=false;
};
async function login(){
  const email=$('li-email').value.trim(), pass=$('li-pass').value;
  if(!email||!pass){$('li-msg').className='msg err';$('li-msg').textContent='Preencha usuário e senha';return}
  $('li-btn').disabled=true;$('li-msg').textContent='';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    await afterLogin();
  }catch(e){$('li-msg').className='msg err';$('li-msg').textContent=err(e)}
  $('li-btn').disabled=false;
}
async function afterLogin(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){showLogin();return}
  let {data:u,error:e1}=await sb.from('usuarios').select('*').eq('id',user.id).maybeSingle();
  if(e1){toast('Erro ao carregar perfil: '+err(e1))}
  if(!u){
    // bootstrap: primeiro login vira gerência
    const nome=user.email.split('@')[0].replace(/[._-]/g,' ').toUpperCase();
    const {data:u2,error:e2}=await sb.rpc('auto_cadastro_gerencia',{p_nome:nome});
    if(e2){$('li-msg').className='msg err';$('li-msg').textContent='Primeiro acesso: '+err(e2);showLogin();return}
    u={id:user.id,nome,perfil:'gerencia',email:user.email};
  }
  ME=u;ME.email=user.email;
  if(ME.perfil==='motorista'){
    const {data:m}=await sb.from('motoristas').select('*').eq('usuario_id',user.id).maybeSingle();
    ME.motorista=m;
  }
  buildNav();$('login').classList.add('hide');$('app').classList.remove('hide');
  go('home');
  loadNotif();
}
function logout(){sb.auth.signOut().then(()=>location.reload())}
/* ============ navegação ============ */
const MENUS={
  pendente:['home'],
  gerencia:['home','veiculos','motoristas','jornadas','conferencia','abastecimentos','despesas','avisos','os','multas','documentos','usuarios','auditoria'],
  motorista:['home','jornada','gastos','avisos','multas','documentos'],
  conferente:['home','conferencia','despesas','avisos','multas'],
  mecanico:['home','os']
};
const TITLES={home:'Início',veiculos:'Veículos',motoristas:'Motoristas',jornadas:'Jornadas',conferencia:'Conferência',abastecimentos:'Abastecimentos',despesas:'Despesas',avisos:'Avisos',os:'Ordens de serviço',multas:'Multas',documentos:'Documentos',usuarios:'Usuários',auditoria:'Auditoria',jornada:'Minha jornada',gastos:'Incluir gasto'};
function buildNav(){
  const items=MENUS[ME.perfil]||MENUS.gerencia;
  NAV=items;
  $('nav').innerHTML=`<div class="who">${esc(ME.nome)}<br><span style="color:var(--acc)">${esc(ME.perfil)}</span></div>`+
    items.map(p=>`<button data-pg="${p}" class="${p===PAGE?'on':''}">${ICONS[p]||'•'} ${TITLES[p]||p}</button>`).join('')+
    `<button id="nv-out">🚪 Sair</button>`;
  $('nav').querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{go(b.dataset.pg);closeNav()});
  $('nv-out').onclick=logout;
}
const ICONS={home:'🏠',veiculos:'🚚',motoristas:'🧑‍✈️',jornadas:'🛣️',conferencia:'📋',abastecimentos:'⛽',despesas:'💰',avisos:'📣',os:'🔧',multas:'🚨',documentos:'📄',usuarios:'👥',auditoria:'🧾',jornada:'🛣️',gastos:'💰'};
$('burger').onclick=()=>{$('nav').classList.add('open');$('scrim').classList.remove('hide')};
$('scrim').onclick=closeNav;
function closeNav(){$('nav').classList.remove('open');$('scrim').classList.add('hide')}
$('bell').onclick=()=>go('notif');
async function loadNotif(){
  if(!ME)return;
  try{
    const {count,error}=await sb.from('notificacoes').select('*',{count:'exact',head:true}).eq('usuario_id',ME.id).eq('lida',false);
    if(error)return;
    const n=count||0;
    $('bdg').textContent=n;$('bdg').classList.toggle('hide',n===0);
  }catch(e){}
}
/* ============ roteador ============ */
const PAGES={};
function go(p){
  PAGE=p;
  $('pg-title').textContent=TITLES[p]||'';
  $('nav').querySelectorAll('[data-pg]').forEach(b=>b.classList.toggle('on',b.dataset.pg===p));
  const fn=PAGES[p]||PAGES.home;
  $('main').innerHTML='';fn($('main'));
  if(p!=='notif')loadNotif();
}
/* ============ helpers de dados ============ */
async function sel(table,cols,order){let q=sb.from(table).select(cols);if(order)q=q.order(order,{ascending:false});const {data,error}=await q;if(error){toast(err(error));return null}return data}
async function ins(table,row){const {data,error}=await sb.from(table).insert(row).select().single();if(error){toast(err(error));return null}await audita(table);return data}
async function upd(table,id,row){const {data,error}=await sb.from(table).update(row).eq('id',id).select().single();if(error){toast(err(error));return null}await audita(table);return data}
async function audita(tabela){
  try{await sb.from('auditoria').insert({acao:tabela,detalhe:{perfil:ME?ME.perfil:null,por:ME?ME.nome:null}})}catch(e){}
}
async function uploadFoto(file,path){
  if(!file)return null;
  if(file.size>8*1024*1024){toast('Foto muito grande (máx 8 MB)');return null}
  const comp=await comprimir(file);
  const {error}=await sb.storage.from('fotos').upload(path,comp,{upsert:true,contentType:comp.type});
  if(error){toast('Erro ao enviar foto: '+err(error));return null}
  return path;
}
async function uploadDoc(file,path){
  const {error}=await sb.storage.from('documentos').upload(path,file,{upsert:true,contentType:file.type||'application/pdf'});
  if(error){toast('Erro ao enviar documento: '+err(error));return null}
  return path;
}
async function assinar(path,bucket){
  const {data,error}=await sb.storage.from(bucket||'fotos').createSignedUrl(path,300);
  if(error){return null}
  return data.signedUrl;
}
async function fotoHtml(path,bucket){
  if(!path)return'';
  const url=await assinar(path,bucket);
  return url?`<img class="photo" src="${url}" alt="comprovante">`:'';
}
async function comprimir(file){
  if(!file.type.startsWith('image/'))return file;
  try{
    const bmp=await createImageBitmap(file);
    const max=1200;let{width:w,height:h}=bmp;
    if(w>max||h>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(bmp,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.7));
    return blob&&blob.size<file.size?new File([blob],(file.name||'foto.jpg').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}):file;
  }catch(e){return file}
}
/* ============ PÁGINAS — MOTORISTA ============ */
PAGES.home=async el=>{
  if(ME.perfil==='pendente'){
    el.innerHTML=`<div class="sec"><h3>⏳ Aguardando liberação</h3><p class="hint">Sua conta foi criada, mas a gerência ainda não definiu seu perfil. Depois de liberado, feche e reabra o app.</p></div>`;
    const b=document.createElement('button');b.className='btn sec';b.textContent='🚪 Sair';b.onclick=logout;el.appendChild(b);
    return;
  }
  if(ME.perfil==='motorista')return PAGES.jornada(el);
  if(ME.perfil==='mecanico')return PAGES.os(el);
  if(ME.perfil==='conferente')return PAGES.conferencia(el);
  return PAGES.dashboard(el);
};
PAGES.jornada=async el=>{
  el.innerHTML=`<h1 class="pg">Minha jornada</h1><div id="j-wrap">${empty('Carregando…')}</div>`;
  const w=$('j-wrap');
  if(!ME.motorista){w.innerHTML=`<div class="sec">Seu usuário ainda não está vinculado a um cadastro de motorista. Peça à gerência.</div>`;return}
  const {data:aberta}=await sb.from('jornadas').select('*, veiculos(placa,modelo)').eq('motorista_id',ME.motorista.id).eq('status','aberta').maybeSingle();
  const {data:ultimas}=await sb.from('jornadas').select('*, veiculos(placa)').eq('motorista_id',ME.motorista.id).neq('status','aberta').order('inicio',{ascending:false}).limit(5);

const CONF_ITENS=['Motorista retornou?','Roteiro informado corretamente?','Todas as notas/canhotos entregues?','Comprovantes anexados?','Divergência ou ocorrência?'];

      </div>
      <div class="row" style="margin-top:10px;font-size:12px;color:var(--mut)"><div>📅 ${fmtDT(j.inicio)}</div><div>🏁 ${fmtDT(j.fim)}</div></div>
      <div class="row" style="margin-top:4px;font-size:12px;color:var(--mut)"><div>🛣️ ${km(j.km_inicial)} → ${km(j.km_final)}</div><div><b style="color:var(--ink)">${kmP!=null?kmP.toLocaleString('pt-BR')+' km percorridos':'—'}</b></div></div>
      <div style="background:#262626;border-radius:8px;height:6px;margin-top:10px;overflow:hidden"><div style="width:${Math.round(p/5*100)}%;height:100%;background:var(--acc)"></div></div>

};
async function pagConfDetalhe(el,jid){
  el.innerHTML=`<h1 class="pg">Conferência</h1><div id="cfd">${empty('Carregando…')}</div>`;
  const d=$('cfd');
  const {data:j}=await sb.from('jornadas').select('*, veiculos(placa,modelo), motoristas(nome)').eq('id',jid).maybeSingle();
  if(!j){d.innerHTML=empty('Jornada não encontrada');return}
  const {data:checks}=await sb.from('jornada_conferencia').select('*').eq('jornada_id',jid);
  const estado={};(checks||[]).forEach(x=>estado[x.item]={ok:x.ok,obs:x.obs||''});
  const [abs,dsp]=await Promise.all([
    sb.from('abastecimentos').select('posto,litros,valor_total,foto_path').eq('jornada_id',jid),
    sb.from('despesas').select('categoria,valor,foto_path').eq('jornada_id',jid)
  ]);
  const comps=[
    ...(abs.data||[]).map(a=>({t:'⛽ Abastecimento — '+(a.posto||'posto'),s:`${a.litros} L · ${fmtBRL(a.valor_total)}`,p:a.foto_path})),
    ...(dsp.data||[]).map(x=>({t:'💰 '+x.categoria,s:fmtBRL(x.valor),p:x.foto_path}))
  ];
  const kmP=j.km_final!=null?Math.round(Number(j.km_final)-Number(j.km_inicial)):null;
  d.innerHTML=`
  <button class="btn sec" id="cf-voltar" style="margin-top:0">← Voltar para a lista</button>
  <div class="sec" style="margin-top:12px">
    <b style="font-size:16px">${esc(j.motoristas?.nome)}</b>
    <div class="hint">${esc(j.veiculos?.placa)} — ${esc(j.veiculos?.modelo||'')} · Roteiro ${j.roteiro}</div>
    <div class="row" style="margin-top:10px;font-size:13px"><div>📅 Saída<br>${fmtDT(j.inicio)}</div><div>🏁 Chegada<br>${fmtDT(j.fim)}</div></div>
    <div class="row" style="margin-top:8px;font-size:13px"><div>🛣️ Km<br>${km(j.km_inicial)} → ${km(j.km_final)}</div><div>📏 Percorridos<br><b style="color:var(--acc)">${kmP!=null?kmP.toLocaleString('pt-BR')+' km':'—'}</b></div></div>
    ${j.ocorrencias?`<div style="margin-top:10px;background:#241d1a;border:1px solid #5c3a2e;border-radius:10px;padding:10px;font-size:13px">⚠️ <b>Ocorrência do motorista:</b><br>${esc(j.ocorrencias)}</div>`:''}
  </div>
  <div class="sec"><h3>Comprovantes da jornada (${comps.length})</h3><div id="cf-comps">${comps.length?'':empty('Nenhum comprovante anexado a esta jornada')}</div></div>
  <div class="sec"><h3>Checklist de conferência</h3><div id="cf-itens"></div>
    <div style="margin-top:12px;font-size:12px;color:var(--mut)" id="cf-prog"></div>
    <button class="btn" id="cf-fechar" style="margin-top:10px">✓ Fechar jornada</button>
    <div class="msg" id="cf-msg"></div>
  </div>`;
  $('cf-voltar').onclick=()=>go('conferencia');
  const cw=$('cf-comps');
  for(const cpt of comps){
    const div=document.createElement('div');
    div.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #242424;font-size:13px';
    div.innerHTML=`<div>${esc(cpt.t)}<div class="hint">${esc(cpt.s)}</div></div>`;
    const btn=document.createElement('button');btn.className='btn mini';btn.textContent='👁 foto';
    btn.onclick=async()=>{const url=await assinar(cpt.p);if(url)window.open(url,'_blank');else toast('Foto não encontrada')};
    div.appendChild(btn);cw.appendChild(div);
  }
  const iw=$('cf-itens');
  const renderItens=()=>{
    iw.innerHTML=CONF_ITENS.map((it,i)=>{
      const st=estado[it]||{};
      const cls=st.ok===true?'cfitem ok':st.ok===false?'cfitem no':'cfitem';
      return `<div class="${cls}" data-i="${i}">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
          <b style="font-size:13px">${i+1}. ${it}</b>
          <div style="display:flex;gap:6px">
            <button class="btn mini" data-ok="${i}" style="margin-top:0">✓</button>
            <button class="btn mini" data-no="${i}" style="margin-top:0">✗</button>
          </div>
        </div>
        ${st.ok===false?`<textarea data-obs="${i}" placeholder="O que está pendente? (salva automático)" style="margin-top:8px">${esc(st.obs||'')}</textarea>`:''}
      </div>`}).join('');
    iw.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{
      const it=CONF_ITENS[b.dataset.ok];
      const {error}=await sb.from('jornada_conferencia').upsert({jornada_id:jid,item:it,ok:true,obs:null,conferido_por:ME.id,conferido_em:new Date().toISOString()});
      if(error){toast(err(error));return}
      estado[it]={ok:true,obs:''};renderItens();atualizaProg();
    });
    iw.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{
      const it=CONF_ITENS[b.dataset.no];
      const {error}=await sb.from('jornada_conferencia').upsert({jornada_id:jid,item:it,ok:false,obs:'',conferido_por:ME.id,conferido_em:new Date().toISOString()});
      if(error){toast(err(error));return}
      estado[it]={ok:false,obs:''};renderItens();atualizaProg();
    });
    iw.querySelectorAll('[data-obs]').forEach(t=>t.addEventListener('change',async()=>{
      const it=CONF_ITENS[t.dataset.obs];
      estado[it].obs=t.value;
      const {error}=await sb.from('jornada_conferencia').upsert({jornada_id:jid,item:it,ok:false,obs:t.value,conferido_por:ME.id,conferido_em:new Date().toISOString()});
      if(error)toast(err(error));
    }));
  };
  const atualizaProg=()=>{
    const ok=CONF_ITENS.filter(it=>estado[it]&&estado[it].ok===true).length;
    const no=CONF_ITENS.filter(it=>estado[it]&&estado[it].ok===false).length;
    $('cf-prog').textContent=`${ok}/5 conferidos${no?` · ${no} pendente(s) — fica registrado quem marcou e quando`:''}`;
    $('cf-fechar').disabled=ok<5;
    $('cf-fechar').textContent=ok<5?`Faltam ${5-ok} item(ns)`:'✓ Fechar jornada';
  };
  renderItens();atualizaProg();
  $('cf-fechar').onclick=async()=>{
    const r=await upd('jornadas',jid,{status:'fechada',conferida_por:ME.id,conferida_em:new Date().toISOString()});
    if(r){toast('Jornada fechada ✓');go('conferencia')}
  };

PAGES.abastecimentos=async el=>{

  const FLOW={recebida:'em_analise',em_analise:'aguardando_peca',aguardando_peca:'em_execucao',em_execucao:'concluida'};
  const LBL={recebida:'▶ Iniciar análise',em_analise:'⏳ Aguardando peça',aguardando_peca:'🔨 Em execução',em_execucao:'✓ Concluir'};
  l.innerHTML=`<div class="tblwrap"><table><tr><th>Aberta</th><th>Veículo</th><th>Descrição</th><th>Diagnóstico</th><th>Custos</th><th>Status</th><th></th></tr>
  ${lista.map(o=>`<tr><td>${fmtDT(o.aberta_em)}</td><td>${esc(o.veiculos?.placa)}</td><td>${esc(o.descricao)}</td><td>${esc(o.diagnostico||'—')}</td><td>${o.mao_obra||o.custos?fmtBRL(Number(o.mao_obra||0)+Number(o.custos||0)):'—'}</td><td>${tag(o.status)}</td>
  <td>${ME.perfil==='mecanico'&&o.status!=='concluida'?`<button class="btn mini" data-osd="${o.id}">✏️ Atualizar</button>`:''}</td></tr>`).join('')}</table></div>`;
  l.querySelectorAll('[data-osd]').forEach(b=>b.onclick=async()=>{
    const o=lista.find(x=>x.id===b.dataset.osd);
    const diag=prompt('Diagnóstico:',o.diagnostico||'');if(diag===null)return;
    const serv=prompt('Serviço realizado:',o.servico||'');if(serv===null)return;
    const pecas=prompt('Peças utilizadas:',o.pecas||'');if(pecas===null)return;
    const mo=prompt('Mão de obra (R$):',o.mao_obra||'');if(mo===null)return;
    const custos=prompt('Outros custos (R$):',o.custos||'');if(custos===null)return;
    const novoStatus=FLOW[o.status]||o.status;
    const r=await upd('ordens_servico',o.id,{diagnostico:diag,servico:serv,pecas:pecas,mao_obra:parseFloat(mo)||null,custos:parseFloat(custos)||null,status:novoStatus,concluida_em:novoStatus==='concluida'?new Date().toISOString():o.concluida_em});
    if(r){toast('OS atualizada');go('os')}
  });
};
PAGES.usuarios=async el=>{
  el.innerHTML=`<h1 class="pg">Usuários</h1>
  <div class="sec"><h3>Vincular login a um perfil</h3>
  <p class="hint">1) Crie o usuário no Supabase (Dashboard → Authentication → Add user). 2) Cole o ID (UUID) aqui com nome e perfil.</p>
  <div class="row"><div><label>UUID do usuário</label><input id="u-id" placeholder="xxxxxxxx-xxxx-..."></div><div><label>Nome</label><input id="u-nome"></div></div>
  <div class="row"><div><label>Perfil</label><select id="u-perfil">${opt([['gerencia','Gerência'],['motorista','Motorista'],['conferente','Conferente'],['mecanico','Mecânico']],null)}</select></div><div><label>&nbsp;</label><button class="btn" id="u-btn">Vincular</button></div></div>
  <div class="msg" id="u-msg"></div></div>
  <div id="u-pend"></div>
  <div id="u-list">${empty('Carregando…')}</div>`;
  $('u-btn').onclick=async()=>{
    const id=$('u-id').value.trim(),nome=$('u-nome').value.trim();
    if(!id||!nome){$('u-msg').className='msg err';$('u-msg').textContent='Informe UUID e nome';return}
    const {error}=await sb.from('usuarios').upsert({id,nome,perfil:$('u-perfil').value});
    if(error){$('u-msg').className='msg err';$('u-msg').textContent=err(error)}
    else{toast('Usuário vinculado');go('usuarios')}
  };
  const {data:lista}=await sel('usuarios','*','nome');
  const l=$('u-list');
  if(!lista||!lista.length){l.innerHTML=empty('Nenhum usuário vinculado');return}
  l.innerHTML=`<div class="tblwrap"><table><tr><th>Nome</th><th>Perfil</th><th>Ativo</th><th></th></tr>
  ${lista.map(u=>`<tr><td><b>${esc(u.nome)}</b></td><td>${tag(u.perfil)}</td><td>${u.ativo?'sim':'não'}</td>
  <td><button class="btn mini" data-up="${u.id}" data-p="${u.perfil==='motorista'?'conferente':u.perfil==='conferente'?'motorista':'motorista'}">trocar p/ ${u.perfil==='motorista'?'conferente':'motorista'}</button></td></tr>`).join('')}</table></div>`;
  l.querySelectorAll('[data-up]').forEach(b=>b.onclick=async()=>{
    if(await upd('usuarios',b.dataset.up,{perfil:b.dataset.p}))go('usuarios');
  });
  const pend=(lista||[]).filter(u=>u.perfil==='pendente');
  const pw=$('u-pend');
  if(pend.length){
    pw.innerHTML=`<div class="sec"><h3>⏳ Aguardando aprovação (${pend.length})</h3>`+pend.map(u=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #242424;font-size:13px"><div><b>${esc(u.nome)}</b><div class="hint">criou conta em ${fmtDT(u.criado_em)}</div></div><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn mini" data-prom="${u.id}" data-p="motorista">Motorista</button><button class="btn mini" data-prom="${u.id}" data-p="conferente">Conferente</button><button class="btn mini" data-prom="${u.id}" data-p="mecanico">Mecânico</button></div></div>`).join('')+`</div>`;
    pw.querySelectorAll('[data-prom]').forEach(b=>b.onclick=async()=>{
      const p=b.dataset.p,id=b.dataset.prom;
      const r=await upd('usuarios',id,{perfil:p});
      if(!r)return;
      if(p==='motorista'){
        const {data:mex}=await sb.from('motoristas').select('id').eq('usuario_id',id).maybeSingle();
        if(!mex){const u=(lista||[]).find(x=>x.id===id);await ins('motoristas',{nome:u?u.nome:'Motorista',usuario_id:id,situacao:'incompleto'})}
      }
      toast('Perfil definido: '+p);go('usuarios');
    });
  }else{pw.innerHTML=''}
};
PAGES.auditoria=async el=>{
  el.innerHTML=`<h1 class="pg">Auditoria</h1><div id="au">${empty('Carregando…')}</div>`;
  const {data:lista}=await sel('auditoria','*, usuarios(nome)','criado_em');
  const l=$('au');
  if(!lista||!lista.length){l.innerHTML=empty('Sem registros');return}
  l.innerHTML=`<div class="tblwrap"><table><tr><th>Quando</th><th>Quem</th><th>Ação</th></tr>
  ${lista.slice(0,200).map(a=>`<tr><td>${fmtDT(a.criado_em)}</td><td>${esc(a.usuarios?.nome||'—')}</td><td>${esc(a.acao)}</td></tr>`).join('')}</table></div>`;
};
/* ============ notificações ============ */
PAGES.notif=async el=>{
  el.innerHTML=`<h1 class="pg">Notificações</h1><div id="nt">${empty('Carregando…')}</div>`;
  const {data:lista}=await sb.from('notificacoes').select('*').eq('usuario_id',ME.id).order('criado_em',{ascending:false}).limit(50);
  const l=$('nt');
  if(!lista||!lista.length){l.innerHTML=empty('Nada por aqui');return}
  l.innerHTML=lista.map(n=>`<div class="sec" style="padding:12px 16px"><b style="font-size:14px">${esc(n.titulo)}</b><p class="hint">${esc(n.corpo||'')}</p><p style="font-size:11px;color:#666">${fmtDT(n.criado_em)}</p></div>`).join('');
  await sb.from('notificacoes').update({lida:true}).eq('usuario_id',ME.id).eq('lida',false);
  $('bdg').classList.add('hide');
};
</script>
